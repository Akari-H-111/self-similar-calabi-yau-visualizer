name: Formal Verification

on:
  push:
    branches:
      - main
      - formal-f06-github-ci-seal
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-lean:
    name: formal-lean
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: formal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up repository-pinned Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          lake-package-directory: formal

      - name: Verify pinned toolchain and dependency lock
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.34.0"
          grep -Fq 'rev = "7801e8406155c31b340d28e2762f754d02b5e9b0"' lakefile.toml
          grep -Fq '"rev": "7801e8406155c31b340d28e2762f754d02b5e9b0"' lake-manifest.json
          lean --version
          lake --version

      - name: Restore mathlib build cache
        run: lake exe cache get

      - name: Build sealed Lean formal core
        run: lake build

      - name: Compile CoordinatePower directly
        run: lake env lean SelfSimilarCY/CoordinatePower.lean

      - name: Compile CoordinatePowerIteration directly
        run: lake env lean SelfSimilarCY/CoordinatePowerIteration.lean

      - name: Compile PullbackTower directly
        run: lake env lean SelfSimilarCY/PullbackTower.lean

      - name: Compile Torus4 directly
        run: lake env lean SelfSimilarCY/Torus4.lean

      - name: Compile TorusCoordinatePower directly
        run: lake env lean SelfSimilarCY/TorusCoordinatePower.lean

      - name: Compile LaurentW directly
        run: lake env lean SelfSimilarCY/LaurentW.lean

      - name: Compile BaseFiber directly
        run: lake env lean SelfSimilarCY/BaseFiber.lean

      - name: Compile StationaryFamily directly
        run: lake env lean SelfSimilarCY/StationaryFamily.lean

      - name: Compile ConcretePullbackTower directly
        run: lake env lean SelfSimilarCY/ConcretePullbackTower.lean

      - name: Compile TorusPowerKernel directly
        run: lake env lean SelfSimilarCY/TorusPowerKernel.lean

      - name: Compile TorusPowerFibers directly
        run: lake env lean SelfSimilarCY/TorusPowerFibers.lean

      - name: Compile LaurentCritical directly
        run: lake env lean SelfSimilarCY/LaurentCritical.lean

      - name: Compile LaurentDifferential directly
        run: lake env lean SelfSimilarCY/LaurentDifferential.lean

      - name: Compile LaurentImplicit directly
        run: lake env lean SelfSimilarCY/LaurentImplicit.lean

      - name: Verify sealed parent Lean blobs
        run: |
          set -euo pipefail
          test "$(git hash-object SelfSimilarCY/CoordinatePower.lean)" = "dcfae8a3ed99544e50ee45aa12acde63e41090c8"
          test "$(git hash-object SelfSimilarCY/CoordinatePowerIteration.lean)" = "4c78793d586e8ba822d4b326f09fd82dc07eaaf9"
          test "$(git hash-object SelfSimilarCY/PullbackTower.lean)" = "1de5fed3c38e67c89d1c8673c7515f312a7af3e0"
          test "$(git hash-object SelfSimilarCY/Torus4.lean)" = "53a8f04018b5f452b05f08c755c7d6ee99978275"
          test "$(git hash-object SelfSimilarCY/TorusCoordinatePower.lean)" = "f58772332d30dbf68a0815691206e7de1c02f1eb"
          test "$(git hash-object SelfSimilarCY/LaurentW.lean)" = "ea6f3ae0b63967b8d9c52428cf825dc53821e781"
          test "$(git hash-object SelfSimilarCY/BaseFiber.lean)" = "4561545d5a7443a9d307b9d6f6acc81aa02f9b8a"
          test "$(git hash-object SelfSimilarCY/StationaryFamily.lean)" = "aa80176d0ad05d18b8e39c426fded1e8b24eab8f"
          test "$(git hash-object SelfSimilarCY/ConcretePullbackTower.lean)" = "32a231cdcd50cbfbcc5f2cd5ce0f86588d2d9984"
          test "$(git hash-object SelfSimilarCY/TorusPowerKernel.lean)" = "2ebffc127658cd6bda8464425bac1154c4fbf8c1"
          test "$(git hash-object SelfSimilarCY/TorusPowerFibers.lean)" = "0df2e2aa373ef47653793bc2d0c3abcb79f1bd03"
          test "$(git hash-object SelfSimilarCY/LaurentCritical.lean)" = "caf9e0af928a76cb6bc14ab2d7d24c68a98b10d6"
          test "$(git hash-object SelfSimilarCY/LaurentDifferential.lean)" = "f3a27de774ecaa3b0e232f1fe7f0b06d381da55b"
          echo "Sealed parent Lean blob guard: passed"

      - name: Reject Lean placeholders
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(axiom|sorry|admit)([^[:alnum:]_]|$)' SelfSimilarCY --include='*.lean'; then
            echo "Forbidden Lean placeholder found."
            exit 1
          fi
          echo "Lean placeholder gate: passed"

  runtime-contracts:
    name: runtime-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Report Node.js version
        run: node --version

      - name: Verify scene specification v0.03
        run: node verify_scene_spec_v0_03.js

      - name: Verify base renderer v0.04
        run: node verify_base_renderer_v0_04.js

      - name: Verify one-step pullback v0.05
        run: node verify_one_step_pullback_v0_05.js

      - name: Verify recursive lazy expansion v0.06
        run: node verify_recursive_lazy_expansion_v0_06.js

      - name: Verify zoom semantics v0.07
        run: node verify_zoom_semantics_v0_07.js

      - name: Verify sheet branch organization v0.08
        run: node verify_sheet_branch_organization_v0_08.js

      - name: Verify arithmetic overlays v0.09
        run: node verify_arithmetic_overlays_v0_09.js

      - name: Verify performance and infinite-navigation semantics v0.10
        run: node verify_performance_infinite_navigation_v0_10.js

      - name: Verify mathematical fidelity v0.11
        run: node verify_mathematical_fidelity_v0_11.js

      - name: Verify UX exposition v0.12
        run: node verify_ux_exposition_v0_12.js

      - name: Verify publication checkpoint v0.13
        run: node verify_publication_checkpoint_v0_13.js

      - name: Verify structural visualization v0.14
        run: node verify_structural_visualization_v0_14.js

      - name: Verify interactive pullback tower v0.15
        run: node verify_interactive_pullback_tower_v0_15.js

      - name: Verify structural camera / zoom v0.16
        run: node verify_structural_camera_zoom_v0_16.js

      - name: Verify D4 branch organization graphics v0.17
        run: node verify_branch_organization_graphics_v0_17.js

      - name: Verify arithmetic overlay graphics v0.18
        run: node verify_arithmetic_overlay_graphics_v0_18.js

      - name: Verify infinite-navigation renderer v0.19
        run: node verify_infinite_navigation_renderer_v0_19.js

      - name: Benchmark infinite-navigation renderer v0.19
        run: node benchmark_infinite_navigation_renderer_v0_19.js

      - name: Verify visual semantics and accessibility v0.20
        run: node verify_visual_semantics_accessibility_v0_20.js

      - name: Verify human interaction remediation v0.20.1
        run: node verify_human_interaction_remediation_v0_20_1.js

      - name: Verify mathematical / visual fidelity audit II v0.21
        run: node verify_mathematical_visual_fidelity_v0_21.js

      - name: Verify public structural visualizer RC v1.0-rc1
        run: node verify_public_structural_visualizer_rc_v1_0_rc1.js

      - name: Verify concrete runtime schema contract v0.01
        run: node verify_concrete_runtime_schema_contract_v0_01.js

      - name: Check runtime source syntax
        run: |
          set -euo pipefail
          node --check scene-spec.js
          node --check base-renderer.js
          node --check one-step-pullback.js
          node --check recursive-lazy-expansion.js
          node --check zoom-semantics.js
          node --check sheet-branch-organization.js
          node --check interactive-pullback-tower.js
          node --check infinite-navigation-renderer.js
          node --check structural-camera.js
          node --check structural-visualization.js
          node --check branch-organization-graphics.js
          node --check arithmetic-overlays.js
          node --check arithmetic-overlay-graphics.js
          node --check exposition-layer.js
          node --check visual-provenance.js
          node --check verify_performance_infinite_navigation_v0_10.js
          node --check benchmark_performance_infinite_navigation_v0_10.js
          node --check verify_mathematical_fidelity_v0_11.js
          node --check verify_ux_exposition_v0_12.js
          node --check verify_publication_checkpoint_v0_13.js
          node --check verify_structural_visualization_v0_14.js
          node --check verify_interactive_pullback_tower_v0_15.js
          node --check verify_structural_camera_zoom_v0_16.js
          node --check verify_branch_organization_graphics_v0_17.js
          node --check verify_arithmetic_overlay_graphics_v0_18.js
          node --check verify_infinite_navigation_renderer_v0_19.js
          node --check benchmark_infinite_navigation_renderer_v0_19.js
          node --check verify_visual_semantics_accessibility_v0_20.js
          node --check verify_human_interaction_remediation_v0_20_1.js
          node --check verify_mathematical_visual_fidelity_v0_21.js
          node --check verify_public_structural_visualizer_rc_v1_0_rc1.js
          node --check verify_public_structural_visualizer_browser_rc_v1_0_rc1.js
          node --check verify_concrete_runtime_schema_contract_v0_01.js
          node --check app.js

  publication-static-smoke:
    name: publication-static-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Serve static repository and verify publication paths
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/publication-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/tmp/publication-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/publication-http.log
            echo "Static HTTP server did not become ready."
            exit 1
          fi

          for resource in \
            style.css \
            scene-spec.js \
            base-renderer.js \
            one-step-pullback.js \
            recursive-lazy-expansion.js \
            zoom-semantics.js \
            sheet-branch-organization.js \
            interactive-pullback-tower.js \
            infinite-navigation-renderer.js \
            structural-visualization.js \
            branch-organization-graphics.js \
            structural-camera.js \
            arithmetic-overlays.js \
            arithmetic-overlay-graphics.js \
            exposition-layer.js \
            visual-provenance.js \
            app.js; do
            curl -fsS "http://127.0.0.1:8000/${resource}" >/dev/null
          done

          curl -fsS http://127.0.0.1:8000/data/system.json >/tmp/publication-system.json
          python3 -m json.tool /tmp/publication-system.json >/dev/null
          grep -Fq '"version": "v0.12"' /tmp/publication-system.json
          grep -Fq '"requestedDepth": 0' /tmp/publication-system.json
          grep -Fq 'No geometric Calabi–Yau hypersurface is currently rendered.' /tmp/publication-index.html
          grep -Fq 'D² runtime metadata' /tmp/publication-index.html
          grep -Fq 'D⁴ organization metadata' /tmp/publication-index.html
          grep -Fq 'Interactive pullback tower' /tmp/publication-index.html
          grep -Fq 'Structural Camera / Zoom Layer' /tmp/publication-index.html
          grep -Fq 'presentation-only structural camera' /tmp/publication-index.html
          grep -Fq 'D⁴ Branch Organization Graphics' /tmp/publication-index.html
          grep -Fq '16-fold structural organization' /tmp/publication-index.html
          grep -Fq 'v1.0-rc1 · Public Structural Visualizer Release Candidate' /tmp/publication-index.html
          grep -Fq 'v0.21 · Mathematical / Visual Fidelity Audit II' /tmp/publication-index.html
          grep -Fq 'visual_provenance_matrix_self_similar_cy_visualizer_v0_21.json' /tmp/publication-index.html
          grep -Fq 'v0.19 · Infinite-Navigation Rendering Engine' /tmp/publication-index.html
          grep -Fq 'Symbolic arithmetic overlays' /tmp/publication-index.html
          grep -Fq 'Coordinate iterate rule' /tmp/publication-index.html
          grep -Fq 'bounded active render window' /tmp/publication-index.html
          grep -Fq 'Canonical requested depth' /tmp/publication-index.html
          test -f .nojekyll
          echo "Publication static HTTP smoke: passed"

  browser-rc:
    name: browser-rc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install pinned Playwright package
        run: npm install --no-save --package-lock=false playwright@1.63.0

      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Exercise RC browser initialization and capture structural screenshots
        run: node verify_public_structural_visualizer_browser_rc_v1_0_rc1.js

      - name: Upload exact-candidate browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: public-structural-visualizer-rc-v1.0-rc1-browser-evidence-${{ github.sha }}
          path: rc-browser-artifacts/
          if-no-files-found: error
          retention-days: 30

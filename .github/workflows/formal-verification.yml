name: Formal Verification

on:
  push:
    branches:
      - main
      - formal-f06-github-ci-seal
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-lean:
    name: formal-lean
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: formal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up repository-pinned Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          lake-package-directory: formal

      - name: Verify pinned toolchain and dependency lock
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.34.0"
          grep -Fq 'rev = "7801e8406155c31b340d28e2762f754d02b5e9b0"' lakefile.toml
          grep -Fq '"rev": "7801e8406155c31b340d28e2762f754d02b5e9b0"' lake-manifest.json
          lean --version
          lake --version

      - name: Restore mathlib build cache
        run: lake exe cache get

      - name: Build sealed Lean formal core
        run: lake build

      - name: Compile CoordinatePower directly
        run: lake env lean SelfSimilarCY/CoordinatePower.lean

      - name: Compile CoordinatePowerIteration directly
        run: lake env lean SelfSimilarCY/CoordinatePowerIteration.lean

      - name: Compile PullbackTower directly
        run: lake env lean SelfSimilarCY/PullbackTower.lean

      - name: Reject Lean placeholders
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(axiom|sorry|admit)([^[:alnum:]_]|$)' SelfSimilarCY --include='*.lean'; then
            echo "Forbidden Lean placeholder found."
            exit 1
          fi
          echo "Lean placeholder gate: passed"

  runtime-contracts:
    name: runtime-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Report Node.js version
        run: node --version

      - name: Verify scene specification v0.03
        run: node verify_scene_spec_v0_03.js

      - name: Verify base renderer v0.04
        run: node verify_base_renderer_v0_04.js

      - name: Verify one-step pullback v0.05
        run: node verify_one_step_pullback_v0_05.js

      - name: Verify recursive lazy expansion v0.06
        run: node verify_recursive_lazy_expansion_v0_06.js

      - name: Verify zoom semantics v0.07
        run: node verify_zoom_semantics_v0_07.js

      - name: Verify sheet branch organization v0.08
        run: node verify_sheet_branch_organization_v0_08.js

      - name: Verify arithmetic overlays v0.09
        run: node verify_arithmetic_overlays_v0_09.js

      - name: Verify performance and infinite-navigation semantics v0.10
        run: node verify_performance_infinite_navigation_v0_10.js

      - name: Verify mathematical fidelity v0.11
        run: node verify_mathematical_fidelity_v0_11.js

      - name: Verify UX exposition v0.12
        run: node verify_ux_exposition_v0_12.js

      - name: Verify publication checkpoint v0.13
        run: node verify_publication_checkpoint_v0_13.js

      - name: Verify structural visualization v0.14
        run: node verify_structural_visualization_v0_14.js

      - name: Verify interactive pullback tower v0.15
        run: node verify_interactive_pullback_tower_v0_15.js

      - name: Verify structural camera / zoom v0.16
        run: node verify_structural_camera_zoom_v0_16.js

      - name: Verify D4 branch organization graphics v0.17
        run: node verify_branch_organization_graphics_v0_17.js

      - name: Verify arithmetic overlay graphics v0.18
        run: node verify_arithmetic_overlay_graphics_v0_18.js

      - name: Check runtime source syntax
        run: |
          set -euo pipefail
          node --check scene-spec.js
          node --check base-renderer.js
          node --check one-step-pullback.js
          node --check recursive-lazy-expansion.js
          node --check zoom-semantics.js
          node --check sheet-branch-organization.js
          node --check interactive-pullback-tower.js
          node --check structural-camera.js
          node --check structural-visualization.js
          node --check branch-organization-graphics.js
          node --check arithmetic-overlays.js
          node --check arithmetic-overlay-graphics.js
          node --check exposition-layer.js
          node --check verify_performance_infinite_navigation_v0_10.js
          node --check benchmark_performance_infinite_navigation_v0_10.js
          node --check verify_mathematical_fidelity_v0_11.js
          node --check verify_ux_exposition_v0_12.js
          node --check verify_publication_checkpoint_v0_13.js
          node --check verify_structural_visualization_v0_14.js
          node --check verify_interactive_pullback_tower_v0_15.js
          node --check verify_structural_camera_zoom_v0_16.js
          node --check verify_branch_organization_graphics_v0_17.js
          node --check verify_arithmetic_overlay_graphics_v0_18.js
          node --check app.js

  publication-static-smoke:
    name: publication-static-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Serve static repository and verify publication paths
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/publication-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/tmp/publication-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/publication-http.log
            echo "Static HTTP server did not become ready."
            exit 1
          fi

          for resource in \
            style.css \
            scene-spec.js \
            base-renderer.js \
            one-step-pullback.js \
            recursive-lazy-expansion.js \
            zoom-semantics.js \
            sheet-branch-organization.js \
            interactive-pullback-tower.js \
            structural-visualization.js \
            branch-organization-graphics.js \
            structural-camera.js \
            arithmetic-overlays.js \
            arithmetic-overlay-graphics.js \
            exposition-layer.js \
            app.js; do
            curl -fsS "http://127.0.0.1:8000/${resource}" >/dev/null
          done

          curl -fsS http://127.0.0.1:8000/data/system.json >/tmp/publication-system.json
          python3 -m json.tool /tmp/publication-system.json >/dev/null
          grep -Fq '"version": "v0.12"' /tmp/publication-system.json
          grep -Fq '"requestedDepth": 0' /tmp/publication-system.json
          grep -Fq 'No geometric Calabi–Yau hypersurface is currently rendered.' /tmp/publication-index.html
          grep -Fq 'D² runtime metadata' /tmp/publication-index.html
          grep -Fq 'D⁴ organization metadata' /tmp/publication-index.html
          grep -Fq 'Interactive pullback tower' /tmp/publication-index.html
          grep -Fq 'Structural Camera / Zoom Layer' /tmp/publication-index.html
          grep -Fq 'presentation-only structural camera' /tmp/publication-index.html
          grep -Fq 'D⁴ Branch Organization Graphics' /tmp/publication-index.html
          grep -Fq '16-fold structural organization' /tmp/publication-index.html
          grep -Fq 'v0.18 · Arithmetic Overlay Graphics' /tmp/publication-index.html
          grep -Fq 'Symbolic arithmetic overlays' /tmp/publication-index.html
          grep -Fq 'Coordinate iterate rule' /tmp/publication-index.html
          grep -Fq 'Canonical requested depth' /tmp/publication-index.html
          test -f .nojekyll
          echo "Publication static HTTP smoke: passed"

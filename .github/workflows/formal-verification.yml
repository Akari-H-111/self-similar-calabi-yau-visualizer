name: Formal Verification

on:
  push:
    branches:
      - main
      - formal-f06-github-ci-seal
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-lean:
    name: formal-lean
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: formal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up repository-pinned Lean environment
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          lake-package-directory: formal

      - name: Verify pinned toolchain and dependency lock
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.34.0"
          grep -Fq 'rev = "7801e8406155c31b340d28e2762f754d02b5e9b0"' lakefile.toml
          grep -Fq '"rev": "7801e8406155c31b340d28e2762f754d02b5e9b0"' lake-manifest.json
          lean --version
          lake --version

      - name: Restore mathlib build cache
        run: lake exe cache get

      - name: Build sealed Lean formal core
        run: lake build

      - name: Compile CoordinatePower directly
        run: lake env lean SelfSimilarCY/CoordinatePower.lean

      - name: Compile CoordinatePowerIteration directly
        run: lake env lean SelfSimilarCY/CoordinatePowerIteration.lean

      - name: Compile PullbackTower directly
        run: lake env lean SelfSimilarCY/PullbackTower.lean

      - name: Compile Torus4 directly
        run: lake env lean SelfSimilarCY/Torus4.lean

      - name: Compile TorusCoordinatePower directly
        run: lake env lean SelfSimilarCY/TorusCoordinatePower.lean

      - name: Compile LaurentW directly
        run: lake env lean SelfSimilarCY/LaurentW.lean

      - name: Compile BaseFiber directly
        run: lake env lean SelfSimilarCY/BaseFiber.lean

      - name: Compile StationaryFamily directly
        run: lake env lean SelfSimilarCY/StationaryFamily.lean

      - name: Compile ConcretePullbackTower directly
        run: lake env lean SelfSimilarCY/ConcretePullbackTower.lean

      - name: Compile TorusPowerKernel directly
        run: lake env lean SelfSimilarCY/TorusPowerKernel.lean

      - name: Compile TorusPowerFibers directly
        run: lake env lean SelfSimilarCY/TorusPowerFibers.lean

      - name: Compile LaurentCritical directly
        run: lake env lean SelfSimilarCY/LaurentCritical.lean

      - name: Compile LaurentDifferential directly
        run: lake env lean SelfSimilarCY/LaurentDifferential.lean

      - name: Compile LaurentImplicit directly
        run: lake env lean SelfSimilarCY/LaurentImplicit.lean

      - name: Verify sealed parent Lean blobs
        run: |
          set -euo pipefail
          test "$(git hash-object SelfSimilarCY/CoordinatePower.lean)" = "dcfae8a3ed99544e50ee45aa12acde63e41090c8"
          test "$(git hash-object SelfSimilarCY/CoordinatePowerIteration.lean)" = "4c78793d586e8ba822d4b326f09fd82dc07eaaf9"
          test "$(git hash-object SelfSimilarCY/PullbackTower.lean)" = "1de5fed3c38e67c89d1c8673c7515f312a7af3e0"
          test "$(git hash-object SelfSimilarCY/Torus4.lean)" = "53a8f04018b5f452b05f08c755c7d6ee99978275"
          test "$(git hash-object SelfSimilarCY/TorusCoordinatePower.lean)" = "f58772332d30dbf68a0815691206e7de1c02f1eb"
          test "$(git hash-object SelfSimilarCY/LaurentW.lean)" = "ea6f3ae0b63967b8d9c52428cf825dc53821e781"
          test "$(git hash-object SelfSimilarCY/BaseFiber.lean)" = "4561545d5a7443a9d307b9d6f6acc81aa02f9b8a"
          test "$(git hash-object SelfSimilarCY/StationaryFamily.lean)" = "aa80176d0ad05d18b8e39c426fded1e8b24eab8f"
          test "$(git hash-object SelfSimilarCY/ConcretePullbackTower.lean)" = "32a231cdcd50cbfbcc5f2cd5ce0f86588d2d9984"
          test "$(git hash-object SelfSimilarCY/TorusPowerKernel.lean)" = "2ebffc127658cd6bda8464425bac1154c4fbf8c1"
          test "$(git hash-object SelfSimilarCY/TorusPowerFibers.lean)" = "0df2e2aa373ef47653793bc2d0c3abcb79f1bd03"
          test "$(git hash-object SelfSimilarCY/LaurentCritical.lean)" = "caf9e0af928a76cb6bc14ab2d7d24c68a98b10d6"
          test "$(git hash-object SelfSimilarCY/LaurentDifferential.lean)" = "f3a27de774ecaa3b0e232f1fe7f0b06d381da55b"
          echo "Sealed parent Lean blob guard: passed"

      - name: Reject Lean placeholders
        run: |
          set -euo pipefail
          if grep -RInE '(^|[^[:alnum:]_])(axiom|sorry|admit)([^[:alnum:]_]|$)' SelfSimilarCY --include='*.lean'; then
            echo "Forbidden Lean placeholder found."
            exit 1
          fi
          echo "Lean placeholder gate: passed"


  publication-static-smoke:
    name: publication-static-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Serve static repository and verify publication paths
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/publication-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/tmp/publication-index.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/publication-http.log
            echo "Static HTTP server did not become ready."
            exit 1
          fi

          for resource in \
            style.css \
            scene-spec.js \
            base-renderer.js \
            one-step-pullback.js \
            recursive-lazy-expansion.js \
            zoom-semantics.js \
            sheet-branch-organization.js \
            interactive-pullback-tower.js \
            infinite-navigation-renderer.js \
            structural-visualization.js \
            branch-organization-graphics.js \
            structural-camera.js \
            arithmetic-overlays.js \
            arithmetic-overlay-graphics.js \
            exposition-layer.js \
            visual-provenance.js \
            concrete-runtime-schema.js \
            projection-slice-semantics.js \
            laurent-evaluator.js \
            base-geometric-sampler.js \
            base-geometric-renderer.js \
            base-geometric-runtime.js \
            base-geometric-renderer.css \
            torus-power-evaluator.js \
            geometric-pullback-fibers.js \
            geometric-pullback-engine.js \
            geometric-pullback-view-semantics.js \
            geometric-pullback-renderer.js \
            geometric-pullback-runtime.js \
            geometric-pullback-renderer.css \
            ancestor-scoped-pullback-runtime.js \
            ancestor-scoped-pullback-visualization-runtime.js \
            ancestor-scoped-pullback-visualization.css \
            hybrid-navigation-semantics.js \
            hybrid-navigation-runtime.js \
            hybrid-navigation.css \
            hybrid-scoped-bridge-semantics.js \
            hybrid-scoped-bridge-runtime.js \
            hybrid-scoped-bridge.css \
            app.js; do
            curl -fsS "http://127.0.0.1:8000/${resource}" >/dev/null
          done

          curl -fsS http://127.0.0.1:8000/data/system.json >/tmp/publication-system.json
          curl -fsS http://127.0.0.1:8000/data/system.v2.json >/tmp/publication-system-v2.json
          curl -fsS http://127.0.0.1:8000/data/geometric-view.v1.json >/tmp/publication-geometric-view.json
          curl -fsS http://127.0.0.1:8000/data/base-geometric-render-config.v1.json >/tmp/publication-geometric-config.json
          curl -fsS http://127.0.0.1:8000/data/geometric-pullback-view.v1.json >/tmp/publication-geometric-pullback-view.json
          curl -fsS http://127.0.0.1:8000/data/geometric-pullback-config.v1.json >/tmp/publication-geometric-pullback-config.json
          curl -fsS http://127.0.0.1:8000/data/hybrid-navigation.v1.json >/tmp/publication-hybrid-navigation.json
          curl -fsS http://127.0.0.1:8000/data/hybrid-scoped-bridge.v1.json >/tmp/publication-hybrid-scoped-bridge.json
          python3 -m json.tool /tmp/publication-system.json >/dev/null
          python3 -m json.tool /tmp/publication-system-v2.json >/dev/null
          python3 -m json.tool /tmp/publication-geometric-view.json >/dev/null
          python3 -m json.tool /tmp/publication-geometric-config.json >/dev/null
          python3 -m json.tool /tmp/publication-geometric-pullback-view.json >/dev/null
          python3 -m json.tool /tmp/publication-geometric-pullback-config.json >/dev/null
          python3 -m json.tool /tmp/publication-hybrid-navigation.json >/dev/null
          python3 -m json.tool /tmp/publication-hybrid-scoped-bridge.json >/dev/null
          grep -Fq '"version": "v0.12"' /tmp/publication-system.json
          grep -Fq '"requestedDepth": 0' /tmp/publication-system.json
          grep -Fq 'The legacy schema-v1 structural pipeline remains non-geometric' /tmp/publication-index.html
          grep -Fq 'Threads 24–26 admit and render finite sampled geometry through schema v2' /tmp/publication-index.html
          grep -Fq 'schema-v2 geometric pipeline admits <code>W_kappa_torus4_v1</code>' /tmp/publication-index.html
          grep -Fq '<strong>Historical v1.0-rc1 release boundary:</strong> Historical checkpoint wording: “No geometric Calabi–Yau hypersurface is currently rendered.”' /tmp/publication-index.html
          test "$(grep -Fo 'No geometric Calabi–Yau hypersurface is currently rendered.' /tmp/publication-index.html | wc -l)" -eq 1
          grep -Fq 'D² runtime metadata' /tmp/publication-index.html
          grep -Fq 'D⁴ organization metadata' /tmp/publication-index.html
          grep -Fq 'Interactive pullback tower' /tmp/publication-index.html
          grep -Fq 'Structural Camera / Zoom Layer' /tmp/publication-index.html
          grep -Fq 'presentation-only structural camera' /tmp/publication-index.html
          grep -Fq 'D⁴ Branch Organization Graphics' /tmp/publication-index.html
          grep -Fq '16-fold structural organization' /tmp/publication-index.html
          grep -Fq 'v1.0-rc1 · Public Structural Visualizer Release Candidate' /tmp/publication-index.html
          grep -Fq 'v0.21 · Mathematical / Visual Fidelity Audit II' /tmp/publication-index.html
          grep -Fq 'visual_provenance_matrix_self_similar_cy_visualizer_v0_21.json' /tmp/publication-index.html
          grep -Fq 'v0.19 · Infinite-Navigation Rendering Engine' /tmp/publication-index.html
          grep -Fq 'Symbolic arithmetic overlays' /tmp/publication-index.html
          grep -Fq 'Coordinate iterate rule' /tmp/publication-index.html
          grep -Fq 'bounded active render window' /tmp/publication-index.html
          grep -Fq 'Canonical requested depth' /tmp/publication-index.html
          grep -Fq 'Sampled projection of X_0 onto the z_1 complex plane' /tmp/publication-index.html
          grep -Fq 'base-geometric-runtime.js' /tmp/publication-index.html
          grep -Fq '"formulaId": "W_kappa_torus4_v1"' /tmp/publication-system-v2.json
          grep -Fq '"viewId": "x0_z1_complex_plane_sampled_projection_v1"' /tmp/publication-geometric-view.json
          grep -Fq '"samplerId": "x0_quadratic_z4_gaussian_lattice_v1"' /tmp/publication-geometric-config.json
          grep -Fq '"viewId": "xn_z1_complex_plane_sampled_pullback_projection_v1"' /tmp/publication-geometric-pullback-view.json
          grep -Fq '"pullbackId": "finite_sampled_geometric_pullback_v1"' /tmp/publication-geometric-pullback-config.json
          grep -Fq 'Finite sampled pullback of X_1 induced from admitted X_0 samples' /tmp/publication-index.html
          grep -Fq 'geometric-pullback-runtime.js' /tmp/publication-index.html
          grep -Fq 'Ancestor-scoped recursive pullback projection' /tmp/publication-index.html
          grep -Fq 'Render selected scope' /tmp/publication-index.html
          grep -Fq 'ancestor-scoped-pullback-runtime.js' /tmp/publication-index.html
          grep -Fq 'ancestor-scoped-pullback-visualization-runtime.js' /tmp/publication-index.html
          grep -Fq '"navigationId": "hybrid_structural_geometric_navigation_v1"' /tmp/publication-hybrid-navigation.json
          grep -Fq '"bridgeId": "hybrid_global_scoped_navigation_v1"' /tmp/publication-hybrid-scoped-bridge.json
          grep -Fq 'Hybrid structural / geometric navigation' /tmp/publication-index.html
          grep -Fq 'global / scoped presentation bridge' /tmp/publication-index.html
          grep -Fq 'Ancestor-scoped geometry' /tmp/publication-index.html
          grep -Fq 'hybrid-navigation-runtime.js' /tmp/publication-index.html
          grep -Fq 'hybrid-scoped-bridge-runtime.js' /tmp/publication-index.html
          test -f .nojekyll
          echo "Publication static HTTP smoke: passed"

  browser-rc:
    name: browser-rc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install pinned Playwright package
        run: npm install --no-save --package-lock=false playwright@1.63.0

      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Exercise RC browser initialization and capture structural screenshots
        run: node verify_public_structural_visualizer_browser_rc_v1_0_rc1.js

      - name: Verify Thread 24 base geometric scene in Chromium
        run: node verify_base_geometric_renderer_browser_v0_01.js

      - name: Verify Thread 25 geometric pullback scene in Chromium
        run: node verify_geometric_pullback_browser_v0_01.js

      - name: Verify Thread 26 hybrid navigation in Chromium
        run: node verify_hybrid_navigation_browser_v0_01.js

      - name: Verify Thread 30 ancestor-scoped geometry in Chromium
        run: node verify_ancestor_scoped_pullback_geometric_browser_v0_01.js

      - name: Verify Thread 31 hybrid global / scoped navigation in Chromium
        run: node verify_hybrid_global_scoped_navigation_browser_v0_01.js

      - name: Upload Thread 24 base geometric browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: thread24-base-geometric-renderer-browser-evidence-${{ github.sha }}
          path: thread24-browser-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Thread 25 geometric pullback browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: thread25-geometric-pullback-browser-evidence-${{ github.sha }}
          path: thread25-browser-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Thread 26 hybrid navigation browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: thread26-hybrid-navigation-browser-evidence-${{ github.sha }}
          path: thread26-browser-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Thread 30 ancestor-scoped browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: thread30-ancestor-scoped-browser-evidence-${{ github.sha }}
          path: thread30-browser-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Thread 31 hybrid global / scoped browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: thread31-hybrid-global-scoped-browser-evidence-${{ github.sha }}
          path: thread31-browser-artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact-candidate browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: public-structural-visualizer-rc-v1.0-rc1-browser-evidence-${{ github.sha }}
          path: rc-browser-artifacts/
          if-no-files-found: error
          retention-days: 30

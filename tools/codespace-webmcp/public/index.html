<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codespace C01R Read-Only Probe</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body { max-width: 900px; margin: 0 auto; padding: 2rem; line-height: 1.5; }
    pre { overflow: auto; padding: 1rem; border: 1px solid currentColor; border-radius: 0.5rem; }
    .ok { font-weight: 700; }
  </style>
</head>
<body>
  <h1>Codespace C01R Read-Only Probe</h1>
  <p>This page exposes no WebMCP tools and performs no write actions.</p>
  <p id="status">Loading runtime state…</p>
  <pre id="output">{}</pre>

  <script>
    const status = document.getElementById("status");
    const output = document.getElementById("output");

    fetch("/api/runtime-state", {
      method: "GET",
      cache: "no-store",
      credentials: "same-origin"
    })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then((state) => {
        output.textContent = JSON.stringify(state, null, 2);
        status.textContent = state.runtime?.codespaces
          ? "Runtime probe succeeded inside GitHub Codespaces."
          : "Runtime probe is running outside GitHub Codespaces.";
        status.className = "ok";
      })
      .catch((error) => {
        status.textContent = `Runtime probe failed: ${error.message}`;
        output.textContent = "{}";
      });
  </script>
</body>
</html>
